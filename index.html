<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spursycoder</title>
  <meta name="description" content="Engineer. Builder. Deployer. All deployed apps by spursycoder." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ── */
    :root {
      --ground: #050505;
      --surface: #0d0d0d;
      --surface-2: #111111;
      --ink: #ffffff;
      --muted: #6b7280;
      --muted-2: #374151;
      --accent-e: #10b981;
      --accent-v: #8b5cf6;
      --font: 'Space Grotesk', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--ground);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY (fixed, pointer-events-none) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ── CONSTELLATION CANVAS ── */
    #constellation {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 4rem;
      transition: background 0.4s var(--ease-out);
    }

    nav.scrolled {
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-wordmark {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      transition: color 0.25s var(--ease-out);
    }

    .nav-links a:hover { color: var(--ink); }

    /* ── HERO ── */
    #hero {
      position: relative;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 0 4rem;
      overflow: hidden;
    }

    .hero-left {
      position: relative;
      z-index: 1;
      padding-top: 6rem;
    }

    .hero-name {
      font-size: clamp(3.5rem, 8.5vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.92;
      color: var(--ink);
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s var(--ease-out) 0.1s forwards;
    }

    .hero-sub {
      margin-top: 2rem;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s var(--ease-out) 0.3s forwards;
    }

    .hero-cta-row {
      margin-top: 3rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s var(--ease-out) 0.5s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--ink);
      color: var(--ground);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 0.85rem 1.75rem;
      border-radius: 4px;
      transition: transform 0.3s var(--ease-out), background 0.3s;
    }

    .btn-primary:hover { transform: translateY(-2px); background: #e5e7eb; }
    .btn-primary:active { transform: translateY(0) scale(0.98); }

    .hero-stat {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .hero-stat strong {
      color: var(--accent-e);
      font-weight: 700;
    }

    .hero-right {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── SECTION GENERIC ── */
    section {
      padding: 10rem 4rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent-e);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .section-heading {
      font-size: clamp(2.5rem, 5vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 4rem;
    }

    /* ── APPS BENTO GRID ── */
    #apps { padding-bottom: 4rem; }

    #grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1rem;
    }

    /* Card base */
    .app-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
      transition:
        transform 0.6s var(--ease-out),
        background 0.3s var(--ease-out),
        opacity 0.6s var(--ease-out);
    }

    .app-card.visible { opacity: 1; transform: translateY(0); }
    .app-card:hover { background: var(--surface-2); transform: translateY(-4px); }
    .app-card:active { transform: translateY(-2px) scale(0.99); }

    /* Accent line on top for featured cards */
    .app-card.featured::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent-v);
    }

    .app-card.span-8  { grid-column: span 8; min-height: 280px; }
    .app-card.span-4  { grid-column: span 4; }
    .app-card.span-6  { grid-column: span 6; }
    .app-card.span-5  { grid-column: span 5; }
    .app-card.span-7  { grid-column: span 7; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-e);
      flex-shrink: 0;
      margin-top: 0.35rem;
      position: relative;
    }

    .live-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--accent-e);
      opacity: 0.2;
      animation: dotPulse 2.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.8); opacity: 0; }
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.2;
      max-width: 85%;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.55;
      margin-top: 0.75rem;
      flex: 1;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .card-meta {
      font-size: 0.725rem;
      color: var(--muted-2);
      letter-spacing: 0.03em;
    }

    .card-arrow {
      font-size: 1rem;
      color: var(--muted);
      transition: transform 0.3s var(--ease-out), color 0.3s;
    }

    .app-card:hover .card-arrow {
      transform: translate(3px, -3px);
      color: var(--ink);
    }

    /* ── SKELETON ── */
    .skeleton {
      background: var(--surface);
      border-radius: 16px;
      min-height: 200px;
      overflow: hidden;
      position: relative;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.04) 50%,
        transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── CONNECT SECTION ── */
    #connect {
      padding: 8rem 4rem 6rem;
      border-top: 2px solid var(--accent-e);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4rem;
    }

    .connect-heading {
      font-size: clamp(2.5rem, 5vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .btn-linkedin {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--ink);
      color: var(--ground);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 4px;
      transition: transform 0.3s var(--ease-out), background 0.3s;
      white-space: nowrap;
    }

    .btn-linkedin:hover { transform: translateY(-2px); background: #e5e7eb; }
    .btn-linkedin:active { transform: scale(0.97); }

    /* ── FOOTER ── */
    footer {
      padding: 3rem 4rem 4rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .footer-name {
      font-size: clamp(2rem, 6vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--ink);
      opacity: 0.08;
      user-select: none;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.6;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 1.5rem 1.5rem; }
      .nav-links { gap: 1.5rem; }

      #hero {
        grid-template-columns: 1fr;
        padding: 0 1.5rem;
        min-height: 100dvh;
        align-content: center;
      }

      .hero-right { display: none; }
      .hero-left { padding-top: 8rem; }

      section { padding: 6rem 1.5rem; }

      #grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .app-card.span-8,
      .app-card.span-4,
      .app-card.span-6,
      .app-card.span-5,
      .app-card.span-7 {
        grid-column: span 1;
      }

      #connect {
        flex-direction: column;
        align-items: flex-start;
        padding: 6rem 1.5rem 4rem;
        gap: 2.5rem;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.5rem;
        padding: 2rem 1.5rem 3rem;
      }

      .footer-copy { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-wordmark" href="/">spursycoder</a>
    <ul class="nav-links">
      <li><a href="#apps">Apps</a></li>
      <li><a href="#connect">LinkedIn</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <canvas id="constellation"></canvas>
    <div class="hero-left">
      <h1 class="hero-name">spursycoder</h1>
      <p class="hero-sub">Engineer. Builder. Deployer.</p>
      <div class="hero-cta-row">
        <a href="#apps" class="btn-primary">View Apps &darr;</a>
        <p class="hero-stat"><strong id="app-count">—</strong> apps deployed to the web</p>
      </div>
    </div>
    <div class="hero-right" aria-hidden="true">
      <!-- constellation canvas fills here -->
    </div>
  </section>

  <!-- APPS -->
  <section id="apps">
    <p class="section-label reveal">Deployed Work</p>
    <h2 class="section-heading reveal">Apps</h2>
    <div id="grid"></div>
  </section>

  <!-- CONNECT -->
  <div id="connect">
    <h2 class="connect-heading reveal">Let's connect.</h2>
    <a
      class="btn-linkedin"
      href="https://www.linkedin.com/in/aastlestephno/"
      target="_blank"
      rel="noopener noreferrer"
    >LinkedIn &nearr;</a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p class="footer-name" aria-hidden="true">spursycoder</p>
    <p class="footer-copy">
      &copy; 2026 spursycoder<br>
      Auto-synced via GitHub API
    </p>
  </footer>

  <script>
    /* ── CONSTANTS ── */
    const USERNAME = 'spursycoder';
    const HUB_REPO = `${USERNAME}.github.io`;
    const LINKEDIN  = 'https://www.linkedin.com/in/aastlestephno/';

    /* ── NAV SCROLL ── */
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    /* ── CONSTELLATION CANVAS ── */
    const canvas = document.getElementById('constellation');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    const NODE_COUNT = 60;
    const MAX_DIST   = 160;
    const COLORS     = ['#10b981', '#8b5cf6', '#ffffff'];

    function resizeCanvas() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    function initNodes() {
      nodes = Array.from({ length: NODE_COUNT }, () => ({
        x:  Math.random() * canvas.width,
        y:  Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r:  Math.random() * 2.2 + 0.8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        pulse: Math.random() * Math.PI * 2
      }));
    }

    function drawFrame(ts) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const n of nodes) {
        n.x  += n.vx;
        n.y  += n.vy;
        n.pulse += 0.02;

        if (n.x < 0 || n.x > canvas.width)  n.vx *= -1;
        if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
      }

      // Draw edges
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            const alpha = (1 - dist / MAX_DIST) * 0.18;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = 0.6;
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw nodes
      for (const n of nodes) {
        const glow = (Math.sin(n.pulse) + 1) * 0.5;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r + glow * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.globalAlpha = 0.55 + glow * 0.35;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(drawFrame);
    }

    const heroSection = document.getElementById('hero');
    canvas.style.position = 'absolute';
    canvas.style.inset = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    heroSection.style.position = 'relative';
    heroSection.style.overflow = 'hidden';
    heroSection.insertBefore(canvas, heroSection.firstChild);

    resizeCanvas();
    initNodes();
    requestAnimationFrame(drawFrame);
    window.addEventListener('resize', () => { resizeCanvas(); initNodes(); }, { passive: true });

    /* ── INTERSECTION OBSERVER (reveals) ── */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    /* ── GITHUB API ── */
    const BENTO_PATTERNS = [
      ['span-8 featured', 'span-4'],
      ['span-4', 'span-8 featured'],
      ['span-6', 'span-6'],
      ['span-5', 'span-7'],
      ['span-7', 'span-5'],
      ['span-4', 'span-4', 'span-4'],
    ];

    function getIcon(lang) {
      const map = { JavaScript:'JS', TypeScript:'TS', Python:'Py', HTML:'HTML', CSS:'CSS', Vue:'Vue', Svelte:'Sv' };
      return map[lang] || '→';
    }

    function renderSkeletons() {
      const grid = document.getElementById('grid');
      grid.innerHTML = Array.from({ length: 6 }, (_, i) => {
        const span = i === 0 ? 'span-8' : i === 1 ? 'span-4' : i < 4 ? 'span-6' : 'span-4';
        return `<div class="skeleton ${span}"></div>`;
      }).join('');
    }

    function renderCards(repos) {
      const grid = document.getElementById('grid');
      if (!repos.length) {
        grid.innerHTML = `<p style="color:var(--muted);grid-column:span 12">No deployed apps found yet.</p>`;
        return;
      }

      let html = '';
      let i = 0;
      let patternIdx = 0;

      while (i < repos.length) {
        const pattern = BENTO_PATTERNS[patternIdx % BENTO_PATTERNS.length];
        patternIdx++;
        for (const cls of pattern) {
          if (i >= repos.length) break;
          const repo = repos[i++];
          const url  = `https://${USERNAME}.github.io/${repo.name}/`;
          const lang = repo.language || 'Web';
          const desc = repo.description || 'No description provided.';
          const updated = new Date(repo.pushed_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

          html += `
            <a class="app-card ${cls}" href="${url}" target="_blank" rel="noopener noreferrer">
              <div class="card-top">
                <span class="card-name">${repo.name}</span>
                <span class="live-dot" title="Live"></span>
              </div>
              <p class="card-desc">${desc}</p>
              <div class="card-bottom">
                <span class="card-meta">${lang} · ${updated}</span>
                <span class="card-arrow">↗</span>
              </div>
            </a>
          `;
        }
      }

      grid.innerHTML = html;
      document.getElementById('app-count').textContent = repos.length;

      // Staggered card reveal
      const cards = grid.querySelectorAll('.app-card');
      const cardIO = new IntersectionObserver((entries) => {
        entries.forEach((e, idx) => {
          if (e.isIntersecting) {
            setTimeout(() => e.target.classList.add('visible'), idx * 60);
            cardIO.unobserve(e.target);
          }
        });
      }, { threshold: 0.05 });
      cards.forEach(c => cardIO.observe(c));
    }

    async function fetchApps() {
      renderSkeletons();
      try {
        let repos = [], page = 1;
        while (true) {
          const res = await fetch(
            `https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=pushed`,
            { headers: { Accept: 'application/vnd.github+json' } }
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const batch = await res.json();
          repos = repos.concat(batch);
          if (batch.length < 100) break;
          page++;
        }

        // Avatar
        try {
          const uRes = await fetch(`https://api.github.com/users/${USERNAME}`);
          if (uRes.ok) {
            const u = await uRes.json();
            // Could add avatar somewhere if desired
          }
        } catch {}

        const apps = repos
          .filter(r => r.has_pages && r.name.toLowerCase() !== HUB_REPO.toLowerCase())
          .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

        renderCards(apps);
      } catch (err) {
        document.getElementById('grid').innerHTML =
          `<p style="color:var(--muted);grid-column:span 12">Could not reach GitHub API. Try again shortly.</p>`;
        console.error(err);
      }
    }

    fetchApps();
  </script>
</body>
</html>

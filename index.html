<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stephno</title>
  <meta name="description" content="likes to build cool software! Apps by stephno." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ── */
    :root {
      --ground:   #050505;
      --ink:      #ffffff;
      --muted:    #6b7280;
      --muted-dim:#2d3748;
      --accent-e: #10b981;
      --accent-v: #8b5cf6;
      --font:     'Space Grotesk', system-ui, sans-serif;
      --ease:     cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── NOISE (fixed, pointer-events-none) ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      z-index: 99; pointer-events: none;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ── CANVAS ── */
    #cosmos-canvas {
      position: fixed; inset: 0;
      z-index: 1;
      cursor: default;
    }

    /* ── HERO UI ── */
    #hero-ui {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      transition: opacity 0.75s var(--ease), transform 0.75s var(--ease);
    }

    /* Hero children receive clicks, but NOT when cosmos is active */
    .hero-content { pointer-events: auto; }
    #hero-ui.cosmos-mode .hero-content { pointer-events: none; }

    #hero-ui.cosmos-mode {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }



    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 4rem 6rem;
    }

    .hero-name {
      font-size: clamp(3.5rem, 8.5vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: var(--ink);
    }

    .hero-sub {
      margin-top: 1.75rem;
      font-size: clamp(0.95rem, 1.4vw, 1.2rem);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .hero-cta {
      margin-top: 2.75rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 0.875rem 1.75rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease), background 0.25s;
      text-decoration: none;
    }

    .btn-primary { background: var(--ink); color: var(--ground); }
    .btn-primary:hover { transform: translateY(-2px); background: #e5e7eb; }
    .btn-primary:active { transform: scale(0.97); }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-outline:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.5); }

    .hero-stat { font-size: 0.775rem; color: var(--muted); }
    .hero-stat strong { color: var(--accent-e); font-weight: 700; }

    /* ── COSMOS UI ── */
    #cosmos-ui {
      position: fixed; inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.75s var(--ease);
    }

    #cosmos-ui.visible { opacity: 1; }

    .cosmos-back {
      position: absolute;
      top: 2.25rem; left: 4rem;
      background: none; border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto;
      transition: color 0.2s var(--ease);
      padding: 0.25rem 0;
    }

    .cosmos-back:hover { color: var(--ink); }

    .cosmos-hint {
      position: absolute;
      bottom: 2.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: var(--muted-dim);
      white-space: nowrap;
      letter-spacing: 0.05em;
    }

    .cosmos-connect {
      position: absolute;
      bottom: 2.25rem; right: 4rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.2s var(--ease);
    }

    .cosmos-connect:hover { color: var(--ink); }

    /* ── NODE INFO CARD ── */
    #node-info {
      position: fixed;
      left: 50%;
      bottom: 5rem;
      transform: translateX(-50%) translateY(14px);
      z-index: 20;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.1rem 1.5rem 1rem;
      pointer-events: none;
      opacity: 0;
      min-width: 240px;
      max-width: min(360px, 90vw);
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
    }

    #node-info.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .info-name {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .info-lang {
      display: inline-block;
      font-size: 0.68rem;
      color: var(--accent-e);
      margin-top: 0.3rem;
      letter-spacing: 0.04em;
    }

    .info-desc {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .info-action {
      display: block;
      font-size: 0.72rem;
      color: var(--accent-e);
      margin-top: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    /* ── CONNECT PANEL ── */
    #connect-panel {
      position: fixed; inset: 0;
      z-index: 40;
      background: var(--ground);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 5rem 0;
      opacity: 0;
      transform: translateY(100%);
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
      pointer-events: none;
    }

    #connect-panel.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .panel-close {
      position: absolute;
      top: 2.25rem; right: 4rem;
      background: none; border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 1.5rem;
      font-weight: 300;
      cursor: pointer;
      transition: color 0.2s var(--ease);
      line-height: 1;
    }

    .panel-close:hover { color: var(--ink); }

    .connect-heading {
      font-size: clamp(2.5rem, 6.5vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .btn-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--ink);
      color: var(--ground);
      text-decoration: none;
      font-family: var(--font);
      font-size: 0.925rem;
      font-weight: 700;
      padding: 1rem 2.25rem;
      border-radius: 4px;
      margin-top: 3rem;
      width: fit-content;
      transition: transform 0.3s var(--ease), background 0.25s;
    }

    .btn-linkedin:hover { transform: translateY(-2px); background: #e5e7eb; }
    .btn-linkedin:active { transform: scale(0.97); }

    .panel-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      border-top: 2px solid var(--accent-e);
      padding: 2rem 5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .panel-footer-ghost {
      font-size: clamp(2.5rem, 6vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--ink);
      opacity: 0.06;
      line-height: 1;
      user-select: none;
    }

    .panel-footer-copy {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.7;
    }

    /* ── LOADING ── */
    #load-hint {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: var(--muted-dim);
      z-index: 15;
      transition: opacity 0.5s;
      pointer-events: none;
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      nav { padding: 1.25rem 1.5rem; }
      .nav-links { gap: 1.5rem; }

      .hero-content {
        padding: 0 1.5rem 5rem;
        justify-content: flex-end;
      }

      .hero-cta { gap: 1rem; }

      .cosmos-back { left: 1.5rem; top: 1.5rem; }
      .cosmos-connect { right: 1.5rem; bottom: 1.5rem; }
      .cosmos-hint { bottom: 1.5rem; }

      #connect-panel { padding: 4rem 1.5rem 0; }
      .panel-close { right: 1.5rem; top: 1.5rem; }
      .panel-footer { padding: 1.5rem 1.5rem; }
    }
  </style>
</head>
<body>

<canvas id="cosmos-canvas"></canvas>

<!-- HERO UI -->
<div id="hero-ui">
  <div class="hero-content">
    <h1 class="hero-name">stephno</h1>
    <p class="hero-sub">likes to build cool software!</p>
    <div class="hero-cta">
      <button class="btn btn-primary" id="explore-btn">Explore the App Universe</button>
      <button class="btn btn-outline" id="connect-hero-btn">Connect with me</button>
      <span class="hero-stat">
        <strong id="app-count">—</strong> apps in the cosmos
      </span>
    </div>
  </div>
</div>

<!-- COSMOS UI -->
<div id="cosmos-ui" aria-hidden="true">
  <button class="cosmos-back" id="back-btn">← Back</button>
  <span class="cosmos-hint">click a node to explore · click again to open</span>
  <a class="cosmos-connect" id="cosmos-connect-btn" role="button" tabindex="0">Connect ↓</a>
</div>

<!-- NODE INFO CARD -->
<div id="node-info" role="tooltip">
  <span class="info-name" id="info-name"></span>
  <span class="info-lang" id="info-lang"></span>
  <span class="info-desc" id="info-desc"></span>
  <span class="info-action" id="info-action">click again to open ↗</span>
</div>

<!-- CONNECT PANEL -->
<div id="connect-panel" aria-modal="true" role="dialog">
  <button class="panel-close" id="panel-close" aria-label="Close">×</button>
  <h2 class="connect-heading">Let's connect.</h2>
  <a
    class="btn-linkedin"
    href="https://www.linkedin.com/in/aastlestephno/"
    target="_blank"
    rel="noopener noreferrer"
  >LinkedIn ↗</a>
  <div class="panel-footer">
    <p class="panel-footer-ghost" aria-hidden="true">stephno</p>
    <p class="panel-footer-copy">© 2026 stephno<br>Auto-synced via GitHub</p>
  </div>
</div>

<!-- LOADING -->
<div id="load-hint">loading cosmos…</div>

<script>
/* ───────────────────────────────────────────────
   CONFIG
─────────────────────────────────────────────── */
const GH_USER  = 'spursycoder';
const HUB_REPO = `${GH_USER}.github.io`;
let   isMobile = window.innerWidth <= 768;

/* ───────────────────────────────────────────────
   CANVAS
─────────────────────────────────────────────── */
const canvas = document.getElementById('cosmos-canvas');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  isMobile = window.innerWidth <= 768;
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (appNodes.length) recomputeCosmosPositions();
}
window.addEventListener('resize', resize, { passive: true });

/* ───────────────────────────────────────────────
   STATE MACHINE  (0 = HERO, 1 = COSMOS)
─────────────────────────────────────────────── */
let mode    = 'HERO';  // 'HERO' | 'COSMOS'
let transT  = 0;       // raw [0,1], animated
let targetT = 0;
const EASE  = t => 1 - Math.pow(1 - t, 3); // ease-out cubic

function enterCosmos() {
  mode    = 'COSMOS';
  targetT = 1;
  document.getElementById('hero-ui').classList.add('cosmos-mode');
  document.getElementById('hero-ui').setAttribute('aria-hidden', 'true');
  const cu = document.getElementById('cosmos-ui');
  cu.classList.add('visible');
  cu.removeAttribute('aria-hidden');
  canvas.style.cursor = 'crosshair';
}

function enterHero() {
  mode    = 'HERO';
  targetT = 0;
  document.getElementById('hero-ui').classList.remove('cosmos-mode');
  document.getElementById('hero-ui').removeAttribute('aria-hidden');
  const cu = document.getElementById('cosmos-ui');
  cu.classList.remove('visible');
  cu.setAttribute('aria-hidden', 'true');
  canvas.style.cursor = 'default';
  deselectAll();
}

/* ───────────────────────────────────────────────
   NODES
─────────────────────────────────────────────── */
let decoNodes = [];
let appNodes  = [];

const DECO_COLORS = [
  'rgba(255,255,255,0.65)',
  'rgba(139,92,246,0.55)',
  'rgba(255,255,255,0.35)',
  'rgba(16,185,129,0.4)',
];

function randBetween(a, b) { return a + Math.random() * (b - a); }

function createDecoNode() {
  return {
    x:  randBetween(0, W),
    y:  randBetween(0, H),
    vx: randBetween(-0.45, 0.45),
    vy: randBetween(-0.45, 0.45),
    r:  randBetween(0.5, 1.8),
    baseAlpha: randBetween(0.08, 0.55),
    color: DECO_COLORS[Math.floor(Math.random() * DECO_COLORS.length)],
    pulse: Math.random() * Math.PI * 2,
  };
}

function initDecoNodes() {
  const count = isMobile ? 30 : 55;
  decoNodes = Array.from({ length: count }, createDecoNode);
}

function initAppNodes(apps) {
  appNodes = apps.map((app) => ({
    x:  randBetween(W * 0.45, W * 0.95),
    y:  randBetween(H * 0.1, H * 0.9),
    vx: randBetween(-0.5, 0.5),
    vy: randBetween(-0.5, 0.5),
    r:  isMobile ? 9 : 7,
    pulse: Math.random() * Math.PI * 2,
    app,
    cosmosX: 0,
    cosmosY: 0,
    hovered: false,
    selected: false,  // first click: show info
    clickAnim: 0,
  }));
  recomputeCosmosPositions();
  document.getElementById('app-count').textContent = apps.length;
  const hint = document.getElementById('load-hint');
  hint.style.opacity = '0';
  setTimeout(() => hint.remove(), 600);
}

/* ───────────────────────────────────────────────
   COSMOS POSITIONS — golden-ratio spiral
─────────────────────────────────────────────── */
function recomputeCosmosPositions() {
  const n = appNodes.length;
  if (!n) return;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const margin = isMobile ? 70 : 110;
  const maxR   = Math.min(W, H) * (isMobile ? 0.38 : 0.41);
  const cx = W / 2, cy = H / 2;

  appNodes.forEach((node, i) => {
    const r     = Math.sqrt((i + 0.5) / n) * maxR;
    const theta = i * GOLDEN;
    node.cosmosX = clamp(cx + r * Math.cos(theta), margin, W - margin);
    node.cosmosY = clamp(cy + r * Math.sin(theta), margin + 36, H - margin);
  });
}

/* ───────────────────────────────────────────────
   INFO CARD
─────────────────────────────────────────────── */
const infoCard   = document.getElementById('node-info');
const infoName   = document.getElementById('info-name');
const infoLang   = document.getElementById('info-lang');
const infoDesc   = document.getElementById('info-desc');
const infoAction = document.getElementById('info-action');

function showInfo(node) {
  infoName.textContent   = node.app.name;
  infoLang.textContent   = node.app.lang;
  infoDesc.textContent   = node.app.desc || 'No description.';
  infoAction.textContent = 'click again to open ↗';
  infoCard.classList.add('visible');
}

function hideInfo() {
  infoCard.classList.remove('visible');
}

/* ───────────────────────────────────────────────
   HIT TEST
─────────────────────────────────────────────── */
function hitNode(px, py) {
  const hitR = isMobile ? 32 : 22;
  for (const n of appNodes) {
    const dx = n.x - px, dy = n.y - py;
    if (Math.sqrt(dx * dx + dy * dy) < Math.max(hitR, n.r + 8)) return n;
  }
  return null;
}

/* ───────────────────────────────────────────────
   SELECTED NODE STATE
─────────────────────────────────────────────── */
let selectedNode = null;

function selectNode(node) {
  // Deselect previous
  if (selectedNode && selectedNode !== node) {
    selectedNode.selected = false;
  }
  selectedNode = node;
  node.selected = true;
  node.clickAnim = 1;
  showInfo(node);
}

function deselectAll() {
  appNodes.forEach(n => { n.selected = false; n.hovered = false; });
  selectedNode = null;
  hideInfo();
}

/* ───────────────────────────────────────────────
   POINTER  (mouse)
─────────────────────────────────────────────── */
let mouseX = -9999, mouseY = -9999;

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (mode !== 'COSMOS') return;
  const hit = hitNode(mouseX, mouseY);
  // Hover highlight (only non-selected nodes)
  appNodes.forEach(n => { n.hovered = (n === hit); });
  canvas.style.cursor = hit ? 'pointer' : 'crosshair';
});

canvas.addEventListener('mouseleave', () => {
  mouseX = -9999; mouseY = -9999;
  appNodes.forEach(n => { n.hovered = false; });
});

canvas.addEventListener('click', e => {
  if (mode !== 'COSMOS') return;
  const hit = hitNode(e.clientX, e.clientY);
  if (!hit) {
    deselectAll();
    return;
  }
  if (hit === selectedNode) {
    // Second click → open immediately (synchronous, no setTimeout — avoids popup blocker)
    const a = document.createElement('a');
    a.href   = hit.app.url;
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    deselectAll();
  } else {
    // First click → select & show info
    selectNode(hit);
  }
});

/* ───────────────────────────────────────────────
   TOUCH
─────────────────────────────────────────────── */
canvas.addEventListener('touchstart', e => {
  if (mode !== 'COSMOS') return;
  const t0  = e.changedTouches[0];
  const hit = hitNode(t0.clientX, t0.clientY);
  if (!hit) {
    deselectAll();
    e.preventDefault();
    return;
  }
  if (hit === selectedNode) {
    // Second tap → open
    const a = document.createElement('a');
    a.href   = hit.app.url;
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    deselectAll();
  } else {
    // First tap → select & show info
    selectNode(hit);
    appNodes.forEach(n => { n.hovered = n === hit; });
  }
  e.preventDefault();
}, { passive: false });

/* ───────────────────────────────────────────────
   CONNECT PANEL
─────────────────────────────────────────────── */
const connectPanel = document.getElementById('connect-panel');

function openConnect() {
  connectPanel.classList.add('visible');
  document.getElementById('panel-close').focus();
}

function closeConnect() {
  connectPanel.classList.remove('visible');
}

document.getElementById('connect-hero-btn').addEventListener('click',   openConnect);
document.getElementById('cosmos-connect-btn').addEventListener('click',  openConnect);
document.getElementById('panel-close').addEventListener('click',         closeConnect);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (connectPanel.classList.contains('visible')) { closeConnect(); return; }
    if (mode === 'COSMOS') enterHero();
  }
});

/* ───────────────────────────────────────────────
   EXPLORE / BACK
─────────────────────────────────────────────── */
document.getElementById('explore-btn').addEventListener('click', enterCosmos);
document.getElementById('back-btn').addEventListener('click',    enterHero);

/* ───────────────────────────────────────────────
   HELPERS
─────────────────────────────────────────────── */
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/* ───────────────────────────────────────────────
   DRAW LOOP
─────────────────────────────────────────────── */
const MAX_DIST_HERO   = 140;
const MAX_DIST_COSMOS = 170;

function tick() {
  ctx.clearRect(0, 0, W, H);

  // Advance transitionT
  transT = clamp(transT + (targetT - transT) * 0.06, 0, 1);
  const t = EASE(transT); // eased [0,1]

  /* ── DECO NODES ── */
  for (const n of decoNodes) {
    n.x += n.vx; n.y += n.vy; n.pulse += 0.018;
    if (n.x < 0)  { n.x = 0;  n.vx *= -1; }
    if (n.x > W)  { n.x = W;  n.vx *= -1; }
    if (n.y < 0)  { n.y = 0;  n.vy *= -1; }
    if (n.y > H)  { n.y = H;  n.vy *= -1; }
  }

  /* ── APP NODES ── */
  for (const n of appNodes) {
    n.pulse += 0.022;
    if (n.clickAnim > 0) n.clickAnim = Math.max(0, n.clickAnim - 0.065);

    if (t < 0.45) {
      // Wander
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0)  { n.x = 0;  n.vx *= -1; }
      if (n.x > W)  { n.x = W;  n.vx *= -1; }
      if (n.y < 0)  { n.y = 0;  n.vy *= -1; }
      if (n.y > H)  { n.y = H;  n.vy *= -1; }
    } else {
      // Spring toward cosmos position (nodes keep gently drifting too)
      const s = (t - 0.45) / 0.55; // [0,1] within cosmos phase
      n.x += (n.cosmosX - n.x) * (0.06 * s);
      n.y += (n.cosmosY - n.y) * (0.06 * s);
      // Subtle organic drift even in cosmos
      n.x += Math.sin(n.pulse * 0.55 + 1.2) * 0.18;
      n.y += Math.cos(n.pulse * 0.45 + 0.7) * 0.18;
    }
  }

  /* ── EDGES: hero constellation ── */
  if (t < 0.85) {
    const all = [...decoNodes, ...appNodes];
    const edgeA = (1 - t * 1.15);
    if (edgeA > 0.01) {
      for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
          const a = all[i], b = all[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < MAX_DIST_HERO) {
            const alpha = (1 - d / MAX_DIST_HERO) * 0.14 * edgeA;
            if (alpha < 0.004) continue;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth   = 0.55;
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
    }
  }

  /* ── EDGES: cosmos emerald ── */
  if (t > 0.25) {
    const cosmosA = (t - 0.25) / 0.75;
    for (let i = 0; i < appNodes.length; i++) {
      for (let j = i + 1; j < appNodes.length; j++) {
        const a = appNodes[i], b = appNodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < MAX_DIST_COSMOS) {
          const alpha = (1 - d / MAX_DIST_COSMOS) * 0.22 * cosmosA;
          if (alpha < 0.004) continue;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(16,185,129,${alpha})`;
          ctx.lineWidth   = 0.65;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  /* ── DRAW DECO NODES ── */
  const decoAlpha = 1 - t;
  if (decoAlpha > 0.01) {
    for (const n of decoNodes) {
      const glow = (Math.sin(n.pulse) + 1) * 0.5;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + glow * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.globalAlpha = n.baseAlpha * decoAlpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ── DRAW APP NODES ── */
  const baseR  = isMobile ? 9 : 7;
  const cosmosR = isMobile ? 16 : 12;

  for (const n of appNodes) {
    const glow      = (Math.sin(n.pulse) + 1) * 0.5;
    const isSelected = n.selected;
    const isHovered  = n.hovered;
    const isActive   = isSelected || isHovered;
    const r = lerp(baseR, cosmosR, t)
            + glow * 1.8
            + n.clickAnim * 10
            + (isSelected ? 6 : isHovered ? 3 : 0);

    // Outer halo
    if (t > 0.15) {
      const haloBase = (t - 0.15) / 0.85;
      const haloA = haloBase * (isSelected ? 0.28 : isHovered ? 0.18 : 0.09);
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + (isSelected ? 18 : 12) + n.clickAnim * 6, 0, Math.PI * 2);
      ctx.fillStyle   = isSelected
        ? 'rgba(52,211,153,0.22)'
        : isHovered
          ? 'rgba(52,211,153,0.14)'
          : `rgba(16,185,129,${haloA})`;
      ctx.globalAlpha = 1;
      ctx.fill();
    }

    // Selection ring
    if (isSelected && t > 0.5) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(52,211,153,0.7)';
      ctx.lineWidth   = 1.5;
      ctx.globalAlpha = 0.8;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Main dot
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle   = isSelected ? '#34d399' : isHovered ? '#2dd4a0' : '#10b981';
    ctx.globalAlpha = 0.88 + glow * 0.12;
    ctx.fill();

    // Bright core
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 0.38, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.9)';
    ctx.globalAlpha = 0.55 + glow * 0.35;
    ctx.fill();

    ctx.globalAlpha = 1;

    /* ── LABELS ── */
    if (t > 0.45) {
      const labelA = (t - 0.45) / 0.55;
      ctx.globalAlpha = labelA;

      if (!isMobile) {
        ctx.font      = `${isActive ? 700 : 400} 12px 'Space Grotesk', sans-serif`;
        ctx.fillStyle = isActive ? '#ffffff' : 'rgba(255,255,255,0.6)';
        ctx.textAlign = 'left';
        ctx.fillText(n.app.name, n.x + r + 9, n.y + 4);
      } else {
        ctx.font      = `${isActive ? 700 : 400} 10px Space Grotesk, sans-serif`;
        ctx.fillStyle = isActive ? '#ffffff' : 'rgba(255,255,255,0.6)';
        ctx.textAlign = 'center';
        ctx.fillText(n.app.name, n.x, n.y + r + 14);
      }

      ctx.globalAlpha = 1;
    }
  }

  requestAnimationFrame(tick);
}

/* ───────────────────────────────────────────────
   GITHUB API
─────────────────────────────────────────────── */
async function fetchApps() {
  try {
    let repos = [], page = 1;
    while (true) {
      const res = await fetch(
        `https://api.github.com/users/${GH_USER}/repos?per_page=100&page=${page}&sort=pushed`,
        { headers: { Accept: 'application/vnd.github+json' } }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const batch = await res.json();
      repos = repos.concat(batch);
      if (batch.length < 100) break;
      page++;
    }

    const apps = repos
      .filter(r => r.has_pages && r.name.toLowerCase() !== HUB_REPO.toLowerCase())
      .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at))
      .map(r => ({
        name: r.name,
        url:  `https://${GH_USER}.github.io/${r.name}/`,
        desc: r.description || '',
        lang: r.language  || 'Web',
      }));

    initAppNodes(apps);
  } catch (err) {
    console.error(err);
    const hint = document.getElementById('load-hint');
    if (hint) hint.textContent = 'could not reach github api';
  }
}

/* ───────────────────────────────────────────────
   BOOT
─────────────────────────────────────────────── */
resize();
initDecoNodes();
fetchApps();
requestAnimationFrame(tick);
</script>
